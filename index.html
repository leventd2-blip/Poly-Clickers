<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Universe - Infinite Clicker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="game-container">
        <!-- Header / Stats Panel -->
        <header class="ui-panel score-panel">
            <h1>Poly Universe</h1>
            <div class="rank-display">Rank: <span id="rank-title">Novice Miner</span></div>
            <div class="score-display">
                <span id="gem-count">0</span> Gems
            </div>
            <div class="currency-row">
                <span>Shards: <strong id="shard-count">0</strong></span>
                <span>Flux: <strong id="flux-count">0</strong></span>
            </div>
            <div class="cps-display">
                Gems/sec: <span id="cps-count">0</span>
            </div>
            <button id="buff-btn" class="action-sub-btn">Activate Energy Surge (15s)</button>
        </header>

        <!-- Main Clicker Area -->
        <main class="ui-panel clicker-panel">
            <div class="poly-button-container">
                <button id="click-btn" class="low-poly-gem">
                    <div class="gem-face top"></div>
                    <div class="gem-face left"></div>
                    <div class="gem-face right"></div>
                </button>
            </div>
            <div id="crit-popup" class="crit-popup hidden">CRIT! +5x</div>
            
            <div class="prestige-section">
                <h3>Singularity Rebirth</h3>
                <p>Crystals: <span id="crystal-count">0</span> (+<span id="crystal-boost">0</span>% Boost)</p>
                <button id="prestige-btn" class="action-sub-btn disabled" disabled>Reset Universe (Req: 10,000 Gems)</button>
            </div>
        </main>

        <!-- Menu Navigation & Panels -->
        <aside class="ui-panel shop-panel">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('shop')">Upgrades</button>
                <button class="tab-btn" onclick="switchTab('refinery')">Refinery</button>
                <button class="tab-btn" onclick="switchTab('relics')">Relics</button>
                <button class="tab-btn" onclick="switchTab('achievements')">Badges</button>
            </div>
            
            <div id="shop-tab" class="tab-content">
                <div id="shop-container" class="shop-list"></div>
            </div>

            <div id="refinery-tab" class="tab-content hidden">
                <div class="refinery-intro">Convert Shards & Flux for massive permanent multiplier boosts!</div>
                <div id="refinery-container" class="shop-list"></div>
            </div>

            <div id="relics-tab" class="tab-content hidden">
                <div class="refinery-intro">Spend Prestige Crystals on game-altering Artifact Relics!</div>
                <div id="relics-container" class="shop-list"></div>
            </div>

            <div id="achievements-tab" class="tab-content hidden">
                <div id="achievements-container" class="shop-list"></div>
            </div>
        </aside>
    </div>

    <!-- Bottom Left Persistent Playtime Stats HUD -->
    <div id="playtime-hud" class="playtime-hud">
        ⏱️ Playtime: <span id="playtime-display">00:00:00</span>
    </div>

    <script src="game.js"></script>
    <script src="ui.js"></script>
    <script src="save.js"></script>
</body>
</html>
